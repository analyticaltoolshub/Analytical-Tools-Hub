name: ATH quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run calculation and repository tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-details
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
